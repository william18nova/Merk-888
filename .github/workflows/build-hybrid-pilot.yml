name: Paquetes del piloto híbrido
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-hybrid-build.txt
      - run: python scripts/build_hybrid_sale_assets.py
      - run: python -m unittest hybrid_client.test_sale_page.OriginalSaleTests
      - run: python -m unittest hybrid_client.test_client hybrid_client.test_printing hybrid_client.test_backup hybrid_client.test_recovery
      - run: python scripts/build_hybrid.py
      - if: runner.os == 'Windows'
        run: python scripts/smoke_hybrid_backup_package.py dist/hybrid/NovaPOS/NovaPOS.exe
      - if: runner.os == 'Linux'
        run: python scripts/smoke_hybrid_backup_package.py dist/hybrid/NovaPOS/NovaPOS
      - uses: actions/upload-artifact@v4
        with:
          name: NovaPOS-piloto-${{ matrix.os }}
          path: dist/hybrid/NovaPOS/
          retention-days: 14
