{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Mi Sitio{% endblock %}</title>

  <link rel="icon" href="{% static 'images/logoNovaAdvance.png' %}">

  <!-- Estilos globales y del navbar -->
  <link rel="stylesheet" href="{% static 'css/navbar.css' %}?v=3"/>
  <link rel="stylesheet" href="{% static 'css/barcode_camera.css' %}?v=2"/>

  {% block extra_head %}{% endblock %}
</head>
<body>
  {% if request.resolver_match.url_name != "login" %}
    {% include "navbar.html" %}
  {% endif %}

  <main class="page-wrap">
    {% block content %}{% endblock %}
  </main>

  <!-- JS del navbar (menú móvil) -->
  <script defer src="{% static 'javascript/number_input_wheel_guard.js' %}"></script>
  <script defer src="{% static 'javascript/navbar.js' %}?v=3"></script>
  <script defer src="{% static 'javascript/page_navigation.js' %}?v=1"></script>
  <script defer
          src="{% static 'javascript/barcode_camera.js' %}?v=2"
          data-zxing-url="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
